<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🏥 Work Schedule</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#F0F4F8;font-family:'Inter','Segoe UI',system-ui,sans-serif}
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
  input[type=number]{-moz-appearance:textfield}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px}
  @media print{
    .no-print{display:none!important}
    body{background:#fff}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const SHIFTS = [
  { id:"s1", label:"15:00 – 19:00", hours:4 },
  { id:"s2", label:"19:00 – 23:00", hours:4 },
  { id:"s3", label:"23:00 – 07:00", hours:8 },
];
const DAYS_S   = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAYS_F   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS_S = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_F = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const SH_COLORS = [
  { bg:"#EFF6FF", border:"#3B82F6", text:"#1E40AF", badge:"#3B82F6" },
  { bg:"#F0FDF4", border:"#16A34A", text:"#14532D", badge:"#16A34A" },
  { bg:"#FFFBEB", border:"#D97706", text:"#78350F", badge:"#D97706" },
];
const LS_KEY_START    = "ws_first_sunday";
const LS_KEY_SCHEDULE = "ws_schedule_v2";
const LS_KEY_PAY      = "ws_pay_v2";
const DEFAULT_START   = "2026-06-14";

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function addDays(dt, n) {
  return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + n);
}
function snapToSunday(isoStr) {
  const [y, m, d] = isoStr.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const dow = dt.getDay();
  const daysUntilSun = dow === 0 ? 0 : 7 - dow;
  return addDays(dt, daysUntilSun);
}
function toISO(dt) {
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
}
function fmt(dt) {
  return `${DAYS_S[dt.getDay()]} ${dt.getDate()} ${MONTHS_S[dt.getMonth()]}`;
}
function fmtFull(dt) {
  return `${DAYS_F[dt.getDay()]}, ${MONTHS_F[dt.getMonth()]} ${dt.getDate()}, ${dt.getFullYear()}`;
}
function fmtTab(ps, pe) {
  return ps.getMonth() === pe.getMonth()
    ? `${MONTHS_S[ps.getMonth()]} ${ps.getDate()}–${pe.getDate()}`
    : `${ps.getDate()} ${MONTHS_S[ps.getMonth()]}–${pe.getDate()} ${MONTHS_S[pe.getMonth()]}`;
}
function emptyDay() {
  return {
    status: "Work",
    shifts: {
      s1: { ipeh:"IP", role:"Floor", unit:"" },
      s2: { ipeh:"IP", role:"Floor", unit:"" },
      s3: { ipeh:"IP", role:"Floor", unit:"" },
    },
  };
}
function buildPeriods(firstSunday) {
  return Array.from({ length: 6 }, (_, i) => {
    const start = addDays(firstSunday, i * 14);
    const end   = addDays(start, 13);
    const days  = Array.from({ length: 14 }, (_, d) => addDays(start, d));
    return { id: i, start, end, payday: end, days };
  });
}
function buildFreshSchedule(periods) {
  const s = {};
  periods.forEach(p => p.days.forEach(dt => { s[dt.toDateString()] = emptyDay(); }));
  return s;
}

// ─── SUMMARY MODAL ───────────────────────────────────────────────────────────
function SummaryModal({ period, schedule, payAmount, onClose }) {
  const rows = [];
  period.days.forEach(dt => {
    const day = schedule[dt.toDateString()];
    if (!day || day.status === "Off") return;
    SHIFTS.forEach(sh => {
      const sd = day.shifts[sh.id] || {};
      rows.push({ date:fmt(dt), shift:sh.label, ipeh:sd.ipeh||"—", role:sd.role||"—", unit:sd.unit||"—", hours:sh.hours });
    });
  });
  const totalH  = rows.reduce((a,r) => a + r.hours, 0);
  const totalOT = rows.reduce((a,r) => a + Math.max(r.hours-8,0), 0);
  const unitMap = {}; rows.forEach(r => { if (r.unit && r.unit!=="—") unitMap[r.unit]=(unitMap[r.unit]||0)+1; });
  const roleMap = { Sitter:0, Floor:0 }; rows.forEach(r => { if (roleMap[r.role]!==undefined) roleMap[r.role]++; });
  const ipehMap = { IP:0, EH:0 };       rows.forEach(r => { if (ipehMap[r.ipeh]!==undefined) ipehMap[r.ipeh]++; });

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"#fff",borderRadius:20,width:"100%",maxWidth:680,maxHeight:"92vh",overflowY:"auto"}}>
        <div style={{background:"linear-gradient(135deg,#1E3A5F,#2D6A9F)",padding:"20px 24px",borderRadius:"20px 20px 0 0"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"start"}}>
            <div>
              <div style={{color:"#90CAF9",fontSize:11,fontWeight:700,marginBottom:4}}>PAY PERIOD {period.id+1} — SUMMARY</div>
              <div style={{color:"#fff",fontSize:15,fontWeight:800}}>{fmtFull(period.start)} → {fmtFull(period.end)}</div>
              <div style={{color:"#B3D4F5",fontSize:12,marginTop:4}}>💰 Payday: {fmtFull(period.payday)}</div>
            </div>
            <button onClick={onClose} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:16}}>✕</button>
          </div>
        </div>
        <div style={{padding:"20px 24px"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:18}}>
            {[
              {label:"Total Hours",val:totalH.toFixed(1),  color:"#1565C0",bg:"#DBEAFE"},
              {label:"Overtime",   val:totalOT.toFixed(1), color:"#C2410C",bg:"#FFEDD5"},
              {label:"Shifts",     val:rows.length,         color:"#15803D",bg:"#DCFCE7"},
              {label:"Pay",        val:payAmount?`$${parseFloat(payAmount).toLocaleString("en-US",{minimumFractionDigits:2})}`:"—",color:"#6A1B9A",bg:"#F3E5F5"},
            ].map(k=>(
              <div key={k.label} style={{background:k.bg,borderRadius:12,padding:"12px 8px",textAlign:"center"}}>
                <div style={{fontSize:20,fontWeight:800,color:k.color}}>{k.val}</div>
                <div style={{fontSize:10,color:"#666",marginTop:2}}>{k.label}</div>
              </div>
            ))}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:18}}>
            {[
              {title:"🏥 Units",   entries:Object.keys(unitMap).length?Object.entries(unitMap):[["None","—"]], vc:"#1565C0"},
              {title:"👤 Role",    entries:Object.entries(roleMap).map(([k,v])=>[k,`${v} shifts`]),            vc:"#15803D"},
              {title:"🔖 Type",    entries:Object.entries(ipehMap).map(([k,v])=>[k,`${v} shifts`]),            vc:"#6A1B9A"},
            ].map(b=>(
              <div key={b.title} style={{background:"#F8FAFC",borderRadius:12,padding:14}}>
                <div style={{fontSize:11,fontWeight:700,color:"#374151",marginBottom:8}}>{b.title}</div>
                {b.entries.map(([k,v])=>(
                  <div key={k} style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <span style={{fontSize:11,color:"#555"}}>{k}</span>
                    <span style={{fontSize:11,fontWeight:700,color:b.vc}}>{v}</span>
                  </div>
                ))}
              </div>
            ))}
          </div>
          <div style={{fontSize:11,fontWeight:700,color:"#6B7280",marginBottom:8}}>📋 SHIFT LOG</div>
          <div style={{borderRadius:10,overflow:"hidden",border:"1px solid #E5E7EB"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1.3fr .5fr .7fr 1.1fr .4fr",background:"#1E3A5F",padding:"8px 12px",gap:4}}>
              {["Date","Shift","Type","Role","Unit","Hrs"].map(h=>(
                <div key={h} style={{color:"#fff",fontSize:10,fontWeight:700}}>{h}</div>
              ))}
            </div>
            {rows.length===0
              ? <div style={{padding:"16px 12px",textAlign:"center",color:"#aaa",fontSize:12}}>No work days logged yet</div>
              : rows.map((r,i)=>(
                <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 1.3fr .5fr .7fr 1.1fr .4fr",padding:"7px 12px",gap:4,background:i%2===0?"#fff":"#F9FAFB",borderTop:"1px solid #F0F0F0"}}>
                  <div style={{fontSize:11,color:"#374151"}}>{r.date}</div>
                  <div style={{fontSize:11,color:"#1D4ED8",fontWeight:600}}>{r.shift}</div>
                  <div style={{fontSize:11,color:"#7C3AED",fontWeight:600}}>{r.ipeh}</div>
                  <div style={{fontSize:11,color:"#15803D",fontWeight:600}}>{r.role}</div>
                  <div style={{fontSize:11,color:"#555"}}>{r.unit}</div>
                  <div style={{fontSize:11,fontWeight:700}}>{r.hours}h</div>
                </div>
              ))}
          </div>
          <button className="no-print" onClick={()=>window.print()} style={{marginTop:14,width:"100%",padding:13,background:"linear-gradient(135deg,#1E3A5F,#2D6A9F)",color:"#fff",border:"none",borderRadius:10,fontSize:13,fontWeight:700,cursor:"pointer"}}>
            🖨️ Print / Save as PDF
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── SETUP SCREEN ────────────────────────────────────────────────────────────
function DateSetupScreen({ onConfirm }) {
  const [inputVal, setInputVal] = useState(DEFAULT_START);
  const picked = inputVal ? snapToSunday(inputVal) : null;
  const isAlready = inputVal && (()=>{ const [y,m,d]=inputVal.split("-").map(Number); return new Date(y,m-1,d).getDay()===0; })();

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#1E3A5F 0%,#1D4ED8 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#fff",borderRadius:24,width:"100%",maxWidth:420,overflow:"hidden",boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}}>
        <div style={{background:"linear-gradient(135deg,#1E3A5F,#2D6A9F)",padding:"28px 28px 22px"}}>
          <div style={{fontSize:36,marginBottom:10}}>🏥</div>
          <div style={{color:"#fff",fontSize:22,fontWeight:800,marginBottom:4}}>Work Schedule</div>
          <div style={{color:"#93C5FD",fontSize:13}}>Let's set up your first pay period</div>
        </div>
        <div style={{padding:"28px 28px 28px"}}>
          <div style={{fontSize:13,fontWeight:700,color:"#374151",marginBottom:6}}>Pick any date — we'll snap to Sunday</div>
          <div style={{fontSize:12,color:"#6B7280",marginBottom:16,lineHeight:1.7}}>
            Pay periods run <strong>Sunday → Saturday</strong> for 14 days. Pick any date in your first pay period and we'll find the right Sunday automatically.
          </div>
          <div style={{fontSize:11,fontWeight:700,color:"#6B7280",marginBottom:6,letterSpacing:.5}}>SELECT A DATE</div>
          <input
            type="date"
            value={inputVal}
            onChange={e => setInputVal(e.target.value)}
            style={{width:"100%",padding:"12px 14px",border:"2px solid #BFDBFE",borderRadius:12,fontSize:15,color:"#1E3A5F",fontWeight:700,outline:"none",marginBottom:14,fontFamily:"inherit"}}
          />
          {picked && (
            <div style={{background:isAlready?"#DCFCE7":"#EFF6FF",border:`1.5px solid ${isAlready?"#16A34A":"#3B82F6"}`,borderRadius:12,padding:"12px 14px",marginBottom:20}}>
              <div style={{fontSize:11,fontWeight:700,color:isAlready?"#15803D":"#1D4ED8",marginBottom:4}}>
                {isAlready ? "✅ That's already a Sunday!" : "📅 Snapping to nearest Sunday"}
              </div>
              <div style={{fontSize:14,fontWeight:800,color:"#1E3A5F"}}>Period 1 starts: {fmtFull(picked)}</div>
              <div style={{fontSize:11,color:"#6B7280",marginTop:4}}>Ends: {fmtFull(addDays(picked,13))} · Payday: {fmtFull(addDays(picked,13))}</div>
            </div>
          )}
          <button
            onClick={() => picked && onConfirm(picked)}
            disabled={!picked}
            style={{width:"100%",padding:"14px",background:picked?"linear-gradient(135deg,#1E3A5F,#1D4ED8)":"#E5E7EB",color:picked?"#fff":"#9CA3AF",border:"none",borderRadius:12,fontSize:14,fontWeight:700,cursor:picked?"pointer":"not-allowed",transition:"all .2s"}}
          >
            Start Scheduling →
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────
function App() {
  const today = new Date();

  const [firstSunday, setFirstSunday] = useState(() => {
    try {
      const saved = localStorage.getItem(LS_KEY_START);
      if (saved) { const [y,m,d] = saved.split("-").map(Number); return new Date(y, m-1, d); }
    } catch(e) {}
    return null;
  });

  const periods = firstSunday ? buildPeriods(firstSunday) : [];

  const [schedule, setSchedule] = useState(() => {
    if (!firstSunday) return {};
    try { const s = localStorage.getItem(LS_KEY_SCHEDULE); if (s) return JSON.parse(s); } catch(e) {}
    return buildFreshSchedule(buildPeriods(firstSunday));
  });

  const [payAmounts, setPayAmounts] = useState(() => {
    try { const s = localStorage.getItem(LS_KEY_PAY); if (s) return JSON.parse(s); } catch(e) {}
    return {};
  });

  const [activePeriod, setActivePeriod] = useState(() => {
    if (!periods.length) return 0;
    const idx = periods.findIndex(p => today >= p.start && today <= p.end);
    return idx < 0 ? 0 : idx;
  });

  const [showSummary,      setShowSummary]      = useState(false);
  const [showResetConfirm, setShowResetConfirm] = useState(false);

  useEffect(() => { try { localStorage.setItem(LS_KEY_SCHEDULE, JSON.stringify(schedule)); } catch(e) {} }, [schedule]);
  useEffect(() => { try { localStorage.setItem(LS_KEY_PAY,      JSON.stringify(payAmounts)); } catch(e) {} }, [payAmounts]);

  function handleSetupConfirm(sunday) {
    const iso = toISO(sunday);
    const newPeriods = buildPeriods(sunday);
    const fresh = buildFreshSchedule(newPeriods);
    try { localStorage.setItem(LS_KEY_START, iso); } catch(e) {}
    try { localStorage.setItem(LS_KEY_SCHEDULE, JSON.stringify(fresh)); } catch(e) {}
    try { localStorage.setItem(LS_KEY_PAY, JSON.stringify({})); } catch(e) {}
    setFirstSunday(sunday);
    setSchedule(fresh);
    setPayAmounts({});
    setActivePeriod(0);
  }

  function handleReset() {
    try { localStorage.removeItem(LS_KEY_START); localStorage.removeItem(LS_KEY_SCHEDULE); localStorage.removeItem(LS_KEY_PAY); } catch(e) {}
    setFirstSunday(null); setSchedule({}); setPayAmounts({}); setActivePeriod(0); setShowResetConfirm(false);
  }

  const updateStatus = useCallback((dateKey, status) => {
    setSchedule(prev => ({ ...prev, [dateKey]: { ...prev[dateKey], status } }));
  }, []);

  const updateShift = useCallback((dateKey, shiftId, field, value) => {
    setSchedule(prev => ({
      ...prev,
      [dateKey]: {
        ...prev[dateKey],
        shifts: { ...prev[dateKey].shifts, [shiftId]: { ...(prev[dateKey].shifts[shiftId]||{}), [field]: value } },
      },
    }));
  }, []);

  if (!firstSunday) return <DateSetupScreen onConfirm={handleSetupConfirm} />;

  const period = periods[activePeriod] || periods[0];

  let totalHours = 0, totalOT = 0, workDays = 0;
  period.days.forEach(dt => {
    const day = schedule[dt.toDateString()];
    if (!day || day.status === "Off") return;
    workDays++;
    SHIFTS.forEach(sh => { totalHours += sh.hours; totalOT += Math.max(sh.hours-8,0); });
  });

  return (
    <div style={{minHeight:"100vh",background:"#F0F4F8"}}>

      {/* HEADER */}
      <div className="no-print" style={{background:"linear-gradient(135deg,#1E3A5F 0%,#1D4ED8 100%)",boxShadow:"0 2px 16px rgba(0,0,0,0.2)"}}>
        <div style={{maxWidth:720,margin:"0 auto",padding:"16px 14px 0"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:18}}>🏥</span>
                <span style={{color:"#fff",fontSize:17,fontWeight:800}}>Work Schedule</span>
                <span style={{background:"rgba(255,255,255,0.15)",color:"#93C5FD",fontSize:9,fontWeight:700,padding:"2px 8px",borderRadius:6}}>AUTOSAVED</span>
              </div>
              <div style={{color:"#93C5FD",fontSize:11,marginTop:2}}>Starting {fmtFull(firstSunday)}</div>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>setShowSummary(true)} style={{background:"rgba(255,255,255,0.15)",border:"1px solid rgba(255,255,255,0.2)",color:"#fff",borderRadius:8,padding:"7px 10px",cursor:"pointer",fontSize:11,fontWeight:600}}>
                📄 Summary
              </button>
              <button onClick={()=>setShowResetConfirm(true)} style={{background:"rgba(239,68,68,0.25)",border:"1px solid rgba(239,68,68,0.4)",color:"#FCA5A5",borderRadius:8,padding:"7px 10px",cursor:"pointer",fontSize:11,fontWeight:600}}>
                ⚙️ Reset
              </button>
            </div>
          </div>
          {/* Tabs */}
          <div style={{display:"flex",gap:3,overflowX:"auto"}}>
            {periods.map((p, idx) => {
              const active    = idx === activePeriod;
              const isCurrent = today >= p.start && today <= p.end;
              return (
                <button key={p.id} onClick={()=>setActivePeriod(idx)} style={{
                  padding:"7px 10px",borderRadius:"9px 9px 0 0",border:"none",cursor:"pointer",
                  background:active?"#F0F4F8":"rgba(255,255,255,0.1)",
                  color:active?"#1E3A5F":isCurrent?"#FDE68A":"rgba(255,255,255,0.65)",
                  fontWeight:active?800:500,fontSize:10,whiteSpace:"nowrap",
                  transition:"all .2s",minWidth:62,lineHeight:1.5,
                }}>
                  {isCurrent&&!active?"▶ ":""}P{idx+1}<br/>
                  <span style={{fontSize:9,opacity:.8}}>{fmtTab(p.start,p.end)}</span>
                </button>
              );
            })}
          </div>
        </div>
      </div>

      {/* BODY */}
      <div style={{maxWidth:720,margin:"0 auto",padding:"14px 12px 100px"}}>

        {/* Stats bar */}
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          {[
            {label:"Total Hours",val:totalHours.toFixed(1),color:"#1D4ED8",bg:"#DBEAFE"},
            {label:"Overtime",   val:totalOT.toFixed(1),   color:"#C2410C",bg:"#FFEDD5"},
            {label:"Work Days",  val:workDays,              color:"#15803D",bg:"#DCFCE7"},
          ].map(s=>(
            <div key={s.label} style={{flex:1,background:s.bg,borderRadius:12,padding:"11px 6px",textAlign:"center"}}>
              <div style={{fontSize:21,fontWeight:800,color:s.color}}>{s.val}</div>
              <div style={{fontSize:10,color:"#555",fontWeight:600,marginTop:1}}>{s.label}</div>
            </div>
          ))}
        </div>

        {/* Period label */}
        <div style={{fontSize:11,fontWeight:700,color:"#6B7280",marginBottom:10,paddingLeft:2}}>
          🗓 {DAYS_F[period.start.getDay()]}, {MONTHS_F[period.start.getMonth()]} {period.start.getDate()} — {DAYS_F[period.end.getDay()]}, {MONTHS_F[period.end.getMonth()]} {period.end.getDate()}, {period.end.getFullYear()}
        </div>

        {/* Day cards */}
        {period.days.map(dt => {
          const key     = dt.toDateString();
          const day     = schedule[key] || emptyDay();
          const isWork  = day.status === "Work";
          const isToday = key === today.toDateString();
          const isSun   = dt.getDay() === 0;
          const isSat   = dt.getDay() === 6;
          const isWkend = isSun || isSat;
          const hdrBg   = !isWork ? "#94A3B8" : isWkend ? "linear-gradient(90deg,#312E81,#4338CA)" : "linear-gradient(90deg,#1E3A5F,#1D4ED8)";

          return (
            <div key={key} style={{
              marginBottom:8,borderRadius:14,overflow:"hidden",
              boxShadow:isToday?"0 0 0 2.5px #3B82F6,0 4px 14px rgba(0,0,0,0.1)":"0 1px 6px rgba(0,0,0,0.07)",
              border:isToday?"2px solid #3B82F6":"2px solid transparent",
            }}>
              {/* Day header */}
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 14px",background:hdrBg}}>
                <div style={{display:"flex",alignItems:"center",gap:5}}>
                  {isToday && <span style={{background:"#3B82F6",color:"#fff",fontSize:9,fontWeight:800,padding:"2px 7px",borderRadius:5}}>TODAY</span>}
                  {isSun   && <span style={{background:"rgba(255,255,255,0.2)",color:"#fff",fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:5}}>SUN</span>}
                  {isSat   && <span style={{background:"rgba(255,255,255,0.2)",color:"#fff",fontSize:9,fontWeight:700,padding:"2px 6px",borderRadius:5}}>SAT</span>}
                  <span style={{color:"#fff",fontWeight:700,fontSize:14}}>{fmt(dt)}</span>
                </div>
                <div style={{display:"flex",background:"rgba(0,0,0,0.2)",borderRadius:20,padding:3,gap:2}}>
                  {["Work","Off"].map(opt=>(
                    <button key={opt} onClick={()=>updateStatus(key,opt)} style={{
                      padding:"5px 12px",borderRadius:16,border:"none",cursor:"pointer",fontSize:11,fontWeight:700,
                      background:day.status===opt?(opt==="Work"?"#22C55E":"#EF4444"):"transparent",
                      color:day.status===opt?"#fff":"rgba(255,255,255,0.45)",transition:"all .15s",
                    }}>{opt}</button>
                  ))}
                </div>
              </div>

              {/* Shifts — collapse when Off */}
              <div style={{maxHeight:isWork?900:0,overflow:"hidden",transition:"max-height 0.35s cubic-bezier(0.4,0,0.2,1)"}}>
                {SHIFTS.map((sh,si)=>{
                  const c  = SH_COLORS[si];
                  const sd = (day.shifts && day.shifts[sh.id]) || {ipeh:"IP",role:"Floor",unit:""};
                  return (
                    <div key={sh.id} style={{background:c.bg,borderTop:`1px solid ${c.border}20`,padding:"10px 14px"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                        <span style={{background:c.badge,color:"#fff",fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20}}>{sh.label}</span>
                        <span style={{fontSize:11,color:c.text,opacity:.6}}>{sh.hours}h{sh.hours>8?` · OT ${sh.hours-8}h`:""}</span>
                      </div>
                      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end"}}>
                        {/* TYPE */}
                        <div>
                          <div style={{fontSize:9,color:"#6B7280",marginBottom:3,fontWeight:700,letterSpacing:.5}}>TYPE</div>
                          <div style={{display:"flex",background:"#fff",borderRadius:8,border:`1.5px solid ${c.border}35`,overflow:"hidden"}}>
                            {["IP","EH"].map(opt=>(
                              <button key={opt} onClick={()=>updateShift(key,sh.id,"ipeh",opt)} style={{
                                padding:"5px 12px",border:"none",cursor:"pointer",fontSize:11,fontWeight:700,
                                background:sd.ipeh===opt?c.badge:"transparent",
                                color:sd.ipeh===opt?"#fff":c.text,transition:"all .15s",
                              }}>{opt}</button>
                            ))}
                          </div>
                        </div>
                        {/* ROLE */}
                        <div>
                          <div style={{fontSize:9,color:"#6B7280",marginBottom:3,fontWeight:700,letterSpacing:.5}}>ROLE</div>
                          <div style={{display:"flex",background:"#fff",borderRadius:8,border:`1.5px solid ${c.border}35`,overflow:"hidden"}}>
                            {["Sitter","Floor"].map(opt=>(
                              <button key={opt} onClick={()=>updateShift(key,sh.id,"role",opt)} style={{
                                padding:"5px 12px",border:"none",cursor:"pointer",fontSize:11,fontWeight:700,
                                background:sd.role===opt?c.badge:"transparent",
                                color:sd.role===opt?"#fff":c.text,transition:"all .15s",
                              }}>{opt}</button>
                            ))}
                          </div>
                        </div>
                        {/* UNIT */}
                        <div style={{flex:1,minWidth:110}}>
                          <div style={{fontSize:9,color:"#6B7280",marginBottom:3,fontWeight:700,letterSpacing:.5}}>UNIT NAME</div>
                          <input type="text" placeholder="e.g. ICU, 3 North…" value={sd.unit||""}
                            onChange={e=>updateShift(key,sh.id,"unit",e.target.value)}
                            style={{width:"100%",padding:"5px 10px",border:`1.5px solid ${c.border}35`,borderRadius:8,
                              fontSize:11,background:"#fff",color:"#1E3A5F",outline:"none",
                              boxSizing:"border-box",fontFamily:"inherit"}}
                          />
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Off message */}
              <div style={{maxHeight:!isWork?40:0,overflow:"hidden",transition:"max-height 0.3s cubic-bezier(0.4,0,0.2,1)"}}>
                <div style={{background:"#F8FAFC",padding:"9px 14px",color:"#94A3B8",fontSize:12,fontStyle:"italic"}}>
                  Day off — no shifts logged
                </div>
              </div>
            </div>
          );
        })}

        {/* Payday card */}
        <div style={{marginTop:20,borderRadius:16,overflow:"hidden",boxShadow:"0 2px 16px rgba(0,0,0,0.1)"}}>
          <div style={{background:"linear-gradient(135deg,#15803D,#22C55E)",padding:"15px 20px"}}>
            <div style={{fontSize:10,color:"#BBF7D0",fontWeight:700,marginBottom:2}}>PERIOD {activePeriod+1} — PAYDAY</div>
            <div style={{color:"#fff",fontWeight:800,fontSize:16}}>💰 {fmtFull(period.payday)}</div>
          </div>
          <div style={{background:"#fff",padding:"15px 20px"}}>
            <div style={{fontSize:10,color:"#9CA3AF",fontWeight:700,marginBottom:8}}>PAY AMOUNT RECEIVED</div>
            <div style={{display:"flex",alignItems:"center",gap:8,borderBottom:"2px solid #F0F0F0",paddingBottom:10}}>
              <span style={{fontSize:22,color:"#15803D",fontWeight:800}}>$</span>
              <input type="number" placeholder="0.00"
                value={payAmounts[activePeriod]||""}
                onChange={e=>setPayAmounts(prev=>({...prev,[activePeriod]:e.target.value}))}
                style={{flex:1,fontSize:26,fontWeight:800,color:"#1E3A5F",border:"none",outline:"none",background:"transparent",fontFamily:"inherit"}}
              />
            </div>
            <div style={{display:"flex",justifyContent:"space-around",marginTop:12}}>
              {[
                {label:"Total Hours",val:`${totalHours.toFixed(1)} hrs`,color:"#1D4ED8"},
                {label:"Overtime",   val:`${totalOT.toFixed(1)} hrs`,   color:"#C2410C"},
                {label:"Work Days",  val:`${workDays} days`,            color:"#15803D"},
              ].map(s=>(
                <div key={s.label} style={{textAlign:"center"}}>
                  <div style={{fontSize:16,fontWeight:800,color:s.color}}>{s.val}</div>
                  <div style={{fontSize:10,color:"#9CA3AF",marginTop:2}}>{s.label}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* SUMMARY MODAL */}
      {showSummary && (
        <SummaryModal period={period} schedule={schedule} payAmount={payAmounts[activePeriod]} onClose={()=>setShowSummary(false)} />
      )}

      {/* RESET CONFIRM */}
      {showResetConfirm && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"#fff",borderRadius:20,width:"100%",maxWidth:380,padding:28}}>
            <div style={{fontSize:28,marginBottom:10}}>⚠️</div>
            <div style={{fontSize:17,fontWeight:800,color:"#1E3A5F",marginBottom:8}}>Change Start Date?</div>
            <div style={{fontSize:13,color:"#6B7280",marginBottom:20,lineHeight:1.6}}>
              This will <strong>clear all your schedule data</strong> and pay amounts, and take you back to the setup screen to pick a new first Sunday.
            </div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setShowResetConfirm(false)} style={{flex:1,padding:"12px",border:"1.5px solid #E5E7EB",borderRadius:10,background:"#fff",color:"#374151",fontSize:13,fontWeight:600,cursor:"pointer"}}>
                Cancel
              </button>
              <button onClick={handleReset} style={{flex:1,padding:"12px",border:"none",borderRadius:10,background:"linear-gradient(135deg,#DC2626,#EF4444)",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                Yes, Reset & Change
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
